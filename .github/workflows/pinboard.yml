name: Pinboard

# The Pinboard sample (Examples/Pinboard): builds the app and runs
# pinboard-check, its flow without a window, on the Firebase emulators.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinboard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: ubuntu-latest
            container: swift:6.2
          # Not windows-latest, and Swift 6.3: see windows.yml.
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
        working-directory: Examples/Pinboard
    steps:
      # gRPC and abseil have paths longer than Windows' default limit.
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
        working-directory: .
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      - run: swift --version
      - name: Install GTK 4
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y libgtk-4-dev
      # Not the checkouts, which SwiftPM recreates from .build/repositories:
      # on Windows, restoring them broke a symbolic link in
      # xctest-dynamic-overlay, which then didn't compile. .build's children
      # rather than .build: the cache hands tar the paths it matched, and tar
      # archives a directory with everything in it, exclusions or not.
      - uses: actions/cache@v4
        with:
          path: |
            Examples/Pinboard/.build/*
            !Examples/Pinboard/.build/checkouts
          key: pinboard-${{ runner.os }}-spm-${{ hashFiles('Examples/Pinboard/Package.resolved', 'Package.resolved') }}
          restore-keys: pinboard-${{ runner.os }}-spm-
      # The products rather than everything: on Linux, a plain `swift build`
      # also builds SwiftCrossUI's WinUI backend, which needs Windows.
      - name: Build
        run: |
          swift build --product Pinboard
          swift build --product pinboard-check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('Examples/Pinboard/firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - run: npm ci --prefix functions
      # In the environment rather than the command: on Windows, emulators:exec
      # hands its command to cmd.exe.
      - name: pinboard-check (Firebase emulators)
        timeout-minutes: 15
        env:
          PINBOARD_EMULATORS: 1
        run: firebase emulators:exec "swift run --skip-build pinboard-check"
