name: Windows

# Windows support is being worked on: this builds each module on its own, so
# one module that doesn't build yet doesn't hide the others, and lists the
# outcome. It runs for branches named windows/… and on demand, not on main.
on:
  push:
    branches: ['windows/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      # gRPC and abseil have paths longer than Windows' default limit.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      # 6.3: the runner's MSVC standard library needs Clang 20 or newer,
      # which 6.2's isn't.
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      - run: swift --version

      # Targets rather than products: on Windows and Linux, building a product
      # builds every target in the package, the Firestore core among them.
      # Without the Firestore trait, so gRPC isn't fetched for the other modules.
      - name: FirebaseCore
        id: core
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseCore
      - name: FirebaseAuth
        id: auth
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseAuth
      - name: FirebaseAppCheck
        id: appcheck
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseAppCheck
      - name: FirebaseFunctions
        id: functions
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseFunctions
      - name: FirebaseStorage
        id: storage
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseStorage
      - name: FirebaseDatabase
        id: database
        continue-on-error: true
        # leveldb lists its sources as "db/", "util/" and so on, which SwiftPM
        # on Windows ignores, so it compiled nothing. It also needs its Windows
        # Env there instead of the POSIX one; SwiftPM can't exclude files per
        # platform, so each guards itself. (Both Envs use the same port, and
        # the Windows one calls the ANSI functions by name, so no defines.)
        run: |
          swift package edit leveldb
          sed -i \
            -e '/^ *"util\/env_windows\.cc",$/d' \
            -e 's#^\( *\)"\(db\|port\|table\|util\|include\)/",$#\1"\2",#' \
            Packages/leveldb/Package.swift
          sed -i -e '1i #if !defined(_WIN32)' -e '$a #endif  // !defined(_WIN32)' Packages/leveldb/util/env_posix.cc
          sed -i -e '1i #if defined(_WIN32)' -e '$a #endif  // defined(_WIN32)' Packages/leveldb/util/env_windows.cc
          git -C Packages/leveldb diff
          swift build --disable-default-traits --target FirebaseDatabase
      - name: FirebaseFirestore
        id: firestore
        continue-on-error: true
        # grpc-ios excludes "src/objective-c/" and "src/cpp/", and SwiftPM on
        # Windows ignores excludes that end in "/" (so PrivacyInfo.xcprivacy
        # gets two rules). Until firebase-swift uses a grpc-ios without them,
        # build against an edited copy. On Windows the copy also
        # - defines NOMINMAX, as gRPC's CMake build does: windows.h's min and
        #   max macros break re2's min() and max();
        # - finds zlib's headers in its bundled copy (gRPC-Core compiles it)
        #   and doesn't link a system zlib, which Windows doesn't have.
        run: |
          # abseil's sources are "absl/", which SwiftPM on Windows ignores
          # (as leveldb's above), so it compiled nothing. On Windows it also
          # needs the defines its own build uses there (absl/copts), NOMINMAX
          # first: windows.h's max() macro breaks numeric_limits<>::max().
          swift package edit abseil-cpp-swiftpm
          sed -i \
            -e 's#^\( *\)"absl/"$#\1"absl"#' \
            -e 's#\.headerSearchPath("\./"),#&\n        .define("NOMINMAX", .when(platforms: [.windows])),\n        .define("WIN32_LEAN_AND_MEAN", .when(platforms: [.windows])),\n        .define("_CRT_SECURE_NO_WARNINGS", .when(platforms: [.windows])),\n        .define("_SCL_SECURE_NO_WARNINGS", .when(platforms: [.windows])),\n        .define("_ENABLE_EXTENDED_ALIGNED_STORAGE", .when(platforms: [.windows])),#' \
            Packages/abseil-cpp-SwiftPM/Package.swift
          git -C Packages/abseil-cpp-SwiftPM diff
          swift package edit grpc-ios
          sed -i \
            -e 's#"src/objective-c/"#"src/objective-c"#g; s#"src/cpp/"#"src/cpp"#g' \
            -e 's#\.headerSearchPath("src/core/ext/upbdefs-gen/"),#&\n        .define("NOMINMAX", .when(platforms: [.windows])),#' \
            -e 's#\.headerSearchPath("third_party/re2/"),#&\n        .headerSearchPath("third_party/zlib", .when(platforms: [.windows])),#' \
            -e 's#\.linkedLibrary("z"),#.linkedLibrary("z", .when(platforms: [.macOS, .iOS, .tvOS, .watchOS, .visionOS, .macCatalyst, .linux, .android])),#' \
            Packages/grpc-ios/Package.swift
          git -C Packages/grpc-ios diff
          # gRPC's BoringSSL needs the Windows defines swift-nio-ssl 2.37.3 added
          # to its copy: windows.h's winsock.h clashes with winsock2.h otherwise.
          swift package edit boringssl-swiftpm
          sed -i \
            -e 's#\.define("OPENSSL_NO_ASM", to: "1"),#&\n        .define("_WINSOCKAPI_", .when(platforms: [.windows])),\n        .define("NOMINMAX", .when(platforms: [.windows])),\n        .define("NOCRYPT", .when(platforms: [.windows])),#' \
            Packages/boringssl-SwiftPM/Package.swift
          # Its thread-exit callback has the same unprefixed name as the one in
          # swift-crypto's BoringSSL (Windows only), so the two don't link
          # together.
          sed -i 's/p_thread_callback_boringssl/p_thread_callback_boringssl_grpc/g' \
            Packages/boringssl-SwiftPM/crypto/thread_win.cc
          git -C Packages/boringssl-SwiftPM diff
          swift build --target FirebaseFirestore

      # Everything, gRPC's C++ included: building a target compiles only what
      # its modules need.
      # Once, after a compile error, the build sat waiting for an hour; the
      # step's own limit keeps that from using up the job.
      - name: Build tests
        id: buildtests
        if: steps.firestore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 75
        # CNIOWindows.h's inline wrappers pass void pointers where WinSock
        # takes char pointers, which C allows and C++ doesn't; so importing
        # NIO (as FirebaseDatabase does) from a module with C++ interop fails.
        run: |
          swift package edit swift-nio
          sed -i \
            -e 's#return getsockopt(s, level, optname, optval,#return getsockopt(s, level, optname, (char *)optval,#' \
            -e 's#return recv(s, buf,#return recv(s, (char *)buf,#' \
            -e 's#return recvfrom(s, buf,#return recvfrom(s, (char *)buf,#' \
            -e 's#return send(s, buf,#return send(s, (const char *)buf,#' \
            -e 's#return setsockopt(s, level, optname, optval,#return setsockopt(s, level, optname, (const char *)optval,#' \
            -e 's#return sendto(s, buf,#return sendto(s, (const char *)buf,#' \
            Packages/swift-nio/Sources/CNIOWindows/include/CNIOWindows.h
          git -C Packages/swift-nio diff
          swift build --build-tests

      # On Windows the Database connects with URLSessionDatabaseTransport
      # (swift-nio-ssl doesn't build there), over swift-corelibs-foundation's
      # WebSockets.
      - uses: actions/setup-java@v4
        if: steps.buildtests.outcome == 'success'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        if: steps.buildtests.outcome == 'success'
        with:
          node-version: 22
      - name: Database integration tests
        id: dbtests
        if: steps.buildtests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --project demo-firebase-swift --only auth,database "swift test --skip-build --filter DatabaseIntegrationTests"

      - name: Summary
        if: always()
        env:
          CORE: ${{ steps.core.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          APPCHECK: ${{ steps.appcheck.outcome }}
          FUNCTIONS: ${{ steps.functions.outcome }}
          STORAGE: ${{ steps.storage.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          FIRESTORE: ${{ steps.firestore.outcome }}
          BUILDTESTS: ${{ steps.buildtests.outcome }}
          DBTESTS: ${{ steps.dbtests.outcome }}
        run: |
          {
            echo "| Module | Build |"
            echo "|---|---|"
            echo "| FirebaseCore | $CORE |"
            echo "| FirebaseAuth | $AUTH |"
            echo "| FirebaseAppCheck | $APPCHECK |"
            echo "| FirebaseFunctions | $FUNCTIONS |"
            echo "| FirebaseStorage | $STORAGE |"
            echo "| FirebaseDatabase | $DATABASE |"
            echo "| FirebaseFirestore | $FIRESTORE |"
            echo
            echo "| Tests | Result |"
            echo "|---|---|"
            echo "| Build (all targets and tests) | ${BUILDTESTS:-not run} |"
            echo "| Database integration (emulator) | ${DBTESTS:-not run} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for outcome in "$CORE" "$AUTH" "$APPCHECK" "$FUNCTIONS" "$STORAGE" "$DATABASE" "$FIRESTORE" "$BUILDTESTS" "$DBTESTS"; do
            [ "$outcome" = success ] || exit 1
          done
