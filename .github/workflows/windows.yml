name: Windows

# Windows support is being worked on: this builds each module on its own, so
# one module that doesn't build yet doesn't hide the others, and lists the
# outcome. It runs for branches named windows/… and on demand, not on main.
on:
  push:
    branches: ['windows/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # gRPC and abseil have paths longer than Windows' default limit.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      # 6.3: the runner's MSVC standard library needs Clang 20 or newer,
      # which 6.2's isn't.
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      - run: swift --version

      # Targets rather than products: on Windows and Linux, building a product
      # builds every target in the package, the Firestore core among them.
      # Without the Firestore trait, so gRPC isn't fetched for the other modules.
      - name: FirebaseCore
        id: core
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseCore
      - name: FirebaseAuth
        id: auth
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseAuth
      - name: FirebaseAppCheck
        id: appcheck
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseAppCheck
      - name: FirebaseFunctions
        id: functions
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseFunctions
      - name: FirebaseStorage
        id: storage
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseStorage
      - name: FirebaseDatabase
        id: database
        continue-on-error: true
        run: swift build --disable-default-traits --target FirebaseDatabase
      - name: FirebaseFirestore
        id: firestore
        continue-on-error: true
        # grpc-ios excludes "src/objective-c/" and "src/cpp/", and SwiftPM on
        # Windows ignores excludes that end in "/" (so PrivacyInfo.xcprivacy
        # gets two rules). Until firebase-swift uses a grpc-ios without them,
        # build against an edited copy. The copy also defines NOMINMAX, as
        # gRPC's CMake build does on Windows: windows.h's min and max macros
        # break re2's min() and max().
        run: |
          swift package edit grpc-ios
          sed -i \
            -e 's#"src/objective-c/"#"src/objective-c"#g; s#"src/cpp/"#"src/cpp"#g' \
            -e 's#\.headerSearchPath("src/core/ext/upbdefs-gen/"),#&\n        .define("NOMINMAX", .when(platforms: [.windows])),#' \
            Packages/grpc-ios/Package.swift
          git -C Packages/grpc-ios diff
          swift build --target FirebaseFirestore

      # Everything, gRPC's C++ included: building a target compiles only what
      # its modules need.
      - name: Build tests
        id: buildtests
        if: steps.firestore.outcome == 'success'
        continue-on-error: true
        run: swift build --build-tests

      # On Windows the Database connects with URLSessionDatabaseTransport
      # (swift-nio-ssl doesn't build there), over swift-corelibs-foundation's
      # WebSockets.
      - uses: actions/setup-java@v4
        if: steps.buildtests.outcome == 'success'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        if: steps.buildtests.outcome == 'success'
        with:
          node-version: 22
      - name: Database integration tests
        id: dbtests
        if: steps.buildtests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --project demo-firebase-swift --only auth,database "swift test --skip-build --filter DatabaseIntegrationTests"

      - name: Summary
        if: always()
        env:
          CORE: ${{ steps.core.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          APPCHECK: ${{ steps.appcheck.outcome }}
          FUNCTIONS: ${{ steps.functions.outcome }}
          STORAGE: ${{ steps.storage.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          FIRESTORE: ${{ steps.firestore.outcome }}
          BUILDTESTS: ${{ steps.buildtests.outcome }}
          DBTESTS: ${{ steps.dbtests.outcome }}
        run: |
          {
            echo "| Module | Build |"
            echo "|---|---|"
            echo "| FirebaseCore | $CORE |"
            echo "| FirebaseAuth | $AUTH |"
            echo "| FirebaseAppCheck | $APPCHECK |"
            echo "| FirebaseFunctions | $FUNCTIONS |"
            echo "| FirebaseStorage | $STORAGE |"
            echo "| FirebaseDatabase | $DATABASE |"
            echo "| FirebaseFirestore | $FIRESTORE |"
            echo
            echo "| Tests | Result |"
            echo "|---|---|"
            echo "| Build (all targets and tests) | ${BUILDTESTS:-not run} |"
            echo "| Database integration (emulator) | ${DBTESTS:-not run} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for outcome in "$CORE" "$AUTH" "$APPCHECK" "$FUNCTIONS" "$STORAGE" "$DATABASE" "$FIRESTORE" "$BUILDTESTS" "$DBTESTS"; do
            [ "$outcome" = success ] || exit 1
          done
