name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-license-headers.sh

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-spm-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - name: Integration tests (Firebase emulators)
        run: >-
          firebase emulators:exec --project demo-firebase-swift --only auth,firestore
          "swift test --skip-build --filter IntegrationTests"

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-spm-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - name: Integration tests (Firebase emulators)
        run: >-
          firebase emulators:exec --project demo-firebase-swift --only auth,firestore
          "swift test --skip-build --filter IntegrationTests"
