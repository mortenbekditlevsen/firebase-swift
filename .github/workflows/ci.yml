name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-license-headers.sh

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-spm-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - run: npm ci --prefix Tests/Emulator/functions
      - name: Integration tests (Firebase emulators)
        run: >-
          firebase emulators:exec --project demo-firebase-swift --only auth,database,firestore,functions,storage
          "swift test --skip-build --filter IntegrationTests"

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: .build-ios-packages
          key: ios-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ios-spm-
      # Builds every library; the iOS-only tests run below, the rest on macOS and Linux.
      - name: Build for the iOS Simulator
        run: >-
          xcodebuild build -scheme firebase-swift-Package
          -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .build-ios-packages -quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - name: iOS-only tests (iOS Simulator, Auth emulator)
        run: scripts/test-ios.sh -clonedSourcePackagesDirPath .build-ios-packages -quiet

  other-apple-platforms:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build-ios-packages
          key: ios-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ios-spm-
      - name: Build for Mac Catalyst and the tvOS Simulator
        run: |
          for destination in 'generic/platform=macOS,variant=Mac Catalyst' 'generic/platform=tvOS Simulator'; do
            xcodebuild build -scheme firebase-swift-Package -destination "$destination" \
              -clonedSourcePackagesDirPath .build-ios-packages -quiet
          done
      # Firestore doesn't support watchOS (upstream neither).
      - name: Build for the watchOS Simulator
        run: |
          for scheme in FirebaseAuth FirebaseDatabase FirebaseFunctions FirebaseStorage; do
            xcodebuild build -scheme "$scheme" -destination 'generic/platform=watchOS Simulator' \
              -clonedSourcePackagesDirPath .build-ios-packages -quiet
          done

  # Cross-compiles with the Swift SDK for Android and runs the unit tests in an
  # Android emulator. The integration tests skip themselves: the Firebase
  # emulators aren't reachable from it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build
          key: android-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: android-spm-
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'
          free-disk-space: true

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-spm-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - run: npm ci --prefix Tests/Emulator/functions
      - name: Integration tests (Firebase emulators)
        run: >-
          firebase emulators:exec --project demo-firebase-swift --only auth,database,firestore,functions,storage
          "swift test --skip-build --filter IntegrationTests"
