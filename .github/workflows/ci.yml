name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test steps have timeouts (several times their usual length), so a hung test
# fails the run instead of holding it until GitHub's six-hour limit.
jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-license-headers.sh

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-spm-
      - name: Build
        run: swift build --build-tests
      - name: Test
        timeout-minutes: 20
        run: swift test --skip-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - run: npm ci --prefix Tests/Emulator/functions
      - name: Integration tests (Firebase emulators)
        timeout-minutes: 20
        run: >-
          firebase emulators:exec --project demo-firebase-swift --only auth,database,firestore,functions,storage
          "swift test --skip-build --filter IntegrationTests"
      # Pipelines need the Firestore emulator's Enterprise edition.
      - name: Pipeline tests (Firestore emulator, Enterprise edition)
        timeout-minutes: 20
        env:
          BACKEND_EDITION: enterprise
        run: >-
          firebase emulators:exec --config Tests/Emulator/firebase.enterprise.json
          --project demo-firebase-swift --only firestore
          "swift test --skip-build --filter 'FirebaseFirestoreIntegrationTests.(Pipeline|QueryToPipeline|Search|RealtimePipeline)'"

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: .build-ios-packages
          key: ios-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ios-spm-
      # Builds every library; the iOS-only tests run below, the rest on macOS and Linux.
      - name: Build for the iOS Simulator
        run: >-
          xcodebuild build -scheme firebase-swift-Package
          -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .build-ios-packages -quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - name: iOS-only tests (iOS Simulator, Auth emulator)
        timeout-minutes: 60
        run: scripts/test-ios.sh -clonedSourcePackagesDirPath .build-ios-packages -quiet

  other-apple-platforms:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build-ios-packages
          key: ios-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ios-spm-
      - name: Build for Mac Catalyst and the tvOS Simulator
        run: |
          for destination in 'generic/platform=macOS,variant=Mac Catalyst' 'generic/platform=tvOS Simulator'; do
            xcodebuild build -scheme firebase-swift-Package -destination "$destination" \
              -clonedSourcePackagesDirPath .build-ios-packages -quiet
          done
      # Firestore doesn't support watchOS (upstream neither).
      - name: Build for the watchOS Simulator
        run: |
          for scheme in FirebaseAuth FirebaseDatabase FirebaseFunctions FirebaseStorage; do
            xcodebuild build -scheme "$scheme" -destination 'generic/platform=watchOS Simulator' \
              -clonedSourcePackagesDirPath .build-ios-packages -quiet
          done

  # Cross-compiles with the Swift SDK for Android and runs the unit tests in an
  # Android emulator. The integration tests skip themselves: the Firebase
  # emulators aren't reachable from it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build
          key: android-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: android-spm-
      - uses: skiptools/swift-android-action@v2
        timeout-minutes: 90
        with:
          swift-version: '6.3'
          free-disk-space: true
          # As apps must (README, Android): the shell's HOME is / on older
          # Android, which isn't writable, so Firestore's data directory
          # can't be created under it.
          test-env: XDG_DATA_HOME=/data/local/tmp
      # On Android, Swift writes fatal errors to logcat, not the terminal, so a
      # crash only shows as a signal. Rerun the action's test script in a new
      # emulator and print the crash log.
      - name: Android crash log
        timeout-minutes: 30
        if: failure()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot
          script: >-
            sh .build/x86_64-unknown-linux-android28/debug/run-android-tests.sh;
            adb logcat -d -b crash | head -150;
            adb logcat -d | grep -E " (F|E) " | grep -iE "swift|fatal|libc|DEBUG" | tail -60;
            exit 1

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-spm-
      - name: Build
        run: swift build --build-tests
      - name: Test
        timeout-minutes: 20
        run: swift test --skip-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm install -g firebase-tools
      - run: npm ci --prefix Tests/Emulator/functions
      - name: Integration tests (Firebase emulators)
        timeout-minutes: 20
        run: >-
          firebase emulators:exec --project demo-firebase-swift --only auth,database,firestore,functions,storage
          "swift test --skip-build --filter IntegrationTests"
      # Pipelines need the Firestore emulator's Enterprise edition.
      - name: Pipeline tests (Firestore emulator, Enterprise edition)
        timeout-minutes: 20
        env:
          BACKEND_EDITION: enterprise
        run: >-
          firebase emulators:exec --config Tests/Emulator/firebase.enterprise.json
          --project demo-firebase-swift --only firestore
          "swift test --skip-build --filter 'FirebaseFirestoreIntegrationTests.(Pipeline|QueryToPipeline|Search|RealtimePipeline)'"

  # The vendored Firestore core's C++ unit tests (GoogleTest), built with
  # upstream's CMake build; see scripts/test-firestore-core.sh.
  firestore-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: firestore-core-ccache-${{ github.sha }}
          restore-keys: firestore-core-ccache-
      - name: Build and run the core tests
        timeout-minutes: 90
        env:
          # Upstream's CMake build uses ccache when it finds it.
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: scripts/test-firestore-core.sh
